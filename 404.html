<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stackly — Page not found</title>
  <meta name="description" content="The page you're looking for has moved or never existed.">
  <meta name="theme-color" content="#111215">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       STACKLY 404 — ANIMATED
       Logo + giant 404 + single Go Back button, with rich motion.
       ========================================================================== */

    :root {
      --bg-dark: #111215;
      --accent-gold: #f4ab36;
      --accent-gold-hover: #e09927;
      --text-dark-primary: #ffffff;
      --text-dark-secondary: #9ea3ae;

      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition-base: 0.35s var(--ease-smooth);
      --radius-full: 9999px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-size: 16px;
      height: 100%;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-dark);
      color: var(--text-dark-primary);
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background: radial-gradient(circle at 80% 25%, rgba(244, 171, 54, 0.10) 0%, rgba(17, 18, 21, 0) 55%),
                  radial-gradient(circle at 15% 80%, rgba(47, 101, 88, 0.12) 0%, rgba(17, 18, 21, 0) 50%),
                  #121316;
    }

    /* Animated aurora gradient behind everything */
    .aurora {
      position: absolute;
      inset: -20%;
      z-index: 0;
      background:
        radial-gradient(35% 35% at 20% 30%, rgba(244, 171, 54, 0.16) 0%, transparent 70%),
        radial-gradient(40% 40% at 80% 70%, rgba(47, 101, 88, 0.20) 0%, transparent 70%),
        radial-gradient(30% 30% at 60% 20%, rgba(244, 171, 54, 0.10) 0%, transparent 70%);
      filter: blur(60px);
      animation: auroraMove 18s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes auroraMove {
      0%   { transform: translate3d(-3%, -2%, 0) scale(1); }
      50%  { transform: translate3d(3%, 2%, 0) scale(1.08); }
      100% { transform: translate3d(-2%, 3%, 0) scale(1.04); }
    }

    /* Grid texture */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 1;
      mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 20%, transparent 75%);
      animation: gridShift 40s linear infinite;
    }

    @keyframes gridShift {
      from { background-position: 0 0, 0 0; }
      to   { background-position: 60px 60px, 60px 60px; }
    }

    /* Floating particle dots */
    .particles {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent-gold);
      opacity: 0.35;
      box-shadow: 0 0 10px rgba(244, 171, 54, 0.6);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% {
        transform: translateY(-110vh) scale(0.6);
        opacity: 0;
      }
    }

    /* Ambient glows */
    .glow {
      position: absolute;
      top: 10%;
      right: -5%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(244, 171, 54, 0.10) 0%, rgba(0,0,0,0) 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 1;
      animation: pulseGlow 8s ease-in-out infinite;
    }

    .glow-2 {
      position: absolute;
      bottom: 5%;
      left: -8%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(47, 101, 88, 0.14) 0%, rgba(0,0,0,0) 70%);
      filter: blur(70px);
      pointer-events: none;
      z-index: 1;
      animation: pulseGlow 10s ease-in-out infinite reverse;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.12); }
    }

    .error-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      width: 100%;
      max-width: 900px;
    }

    /* Logo with hover lift + fade-down entrance */
    .error-logo {
      margin-bottom: 56px;
      opacity: 0;
      transform: translateY(-16px);
      animation: fadeDown 0.9s var(--ease-smooth) 0.15s forwards;
    }

    .error-logo img {
      height: 34px;
      width: auto;
      display: block;
      transition: transform 0.4s var(--ease-spring), filter 0.4s var(--ease-smooth);
    }

    .error-logo:hover img {
      transform: translateY(-3px) scale(1.05);
      filter: drop-shadow(0 6px 18px rgba(244, 171, 54, 0.4));
    }

    @keyframes fadeDown {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Giant 404 */
    .error-number-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      user-select: none;
      margin-bottom: 48px;
      opacity: 0;
      transform: scale(0.92);
      animation: numberEnter 1.1s var(--ease-spring) 0.35s forwards;
    }

    @keyframes numberEnter {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Soft glowing halo behind the number */
    .error-number-wrap::before {
      content: '';
      position: absolute;
      width: 70%;
      height: 70%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 171, 54, 0.22) 0%, transparent 70%);
      filter: blur(40px);
      z-index: 0;
      animation: haloPulse 4s ease-in-out infinite;
    }

    @keyframes haloPulse {
      0%, 100% { transform: scale(1);   opacity: 0.7; }
      50%      { transform: scale(1.15); opacity: 1; }
    }

    .error-number {
      font-size: clamp(8rem, 26vw, 20rem);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 0.82;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.18);
      position: relative;
      z-index: 1;
      animation: breathe 6s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { -webkit-text-stroke-color: rgba(255, 255, 255, 0.18); }
      50%      { -webkit-text-stroke-color: rgba(255, 255, 255, 0.28); }
    }

    /* Gold fill with animated sheen */
    .error-number-fill {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(8rem, 26vw, 20rem);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 0.82;
      z-index: 2;
      clip-path: inset(100% 0 0 0);
      transition: clip-path 1.2s var(--ease-smooth);

      /* Animated gold gradient + sheen */
      background: linear-gradient(
        100deg,
        #e09927 0%,
        #f4ab36 25%,
        #ffd88a 50%,
        #f4ab36 75%,
        #e09927 100%
      );
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: goldSheen 4s linear infinite;
    }

    @keyframes goldSheen {
      0%   { background-position: 0% 50%; }
      100% { background-position: 250% 50%; }
    }

    .error-wrap.in-view .error-number-fill {
      clip-path: inset(0 0 0 0);
    }

    /* Go Back Button — magnetic + shine sweep */
    .btn-back {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--accent-gold);
      color: #121316;
      padding: 15px 36px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: var(--radius-full);
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(244, 171, 54, 0.25);
      transition: transform 0.35s var(--ease-spring),
                  box-shadow 0.35s var(--ease-smooth),
                  background 0.3s var(--ease-smooth);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.9s var(--ease-smooth) 0.9s forwards;
      overflow: hidden;
      isolation: isolate;
    }

    /* Shine sweep on hover */
    .btn-back::before {
      content: '';
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent 0%,
        rgba(255, 255, 255, 0.55) 50%,
        transparent 100%
      );
      transform: skewX(-20deg);
      transition: left 0.6s var(--ease-smooth);
      z-index: 1;
      pointer-events: none;
    }

    .btn-back:hover::before {
      left: 125%;
    }

    .btn-back:hover {
      background: var(--accent-gold-hover);
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 32px rgba(244, 171, 54, 0.45);
    }

    .btn-back:active {
      transform: translateY(-1px) scale(0.99);
    }

    .btn-back svg {
      position: relative;
      z-index: 2;
      transition: transform 0.35s var(--ease-spring);
    }

    .btn-back:hover svg {
      transform: translateX(-5px);
    }

    .btn-back span {
      position: relative;
      z-index: 2;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Subtle continuous float on the whole block */
    .error-wrap {
      animation: gentleFloat 7s ease-in-out infinite;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .error-number-fill { clip-path: inset(0 0 0 0); }
      .error-logo,
      .error-number-wrap,
      .btn-back { opacity: 1; transform: none; }
    }

    @media (max-width: 540px) {
      .error-logo { margin-bottom: 40px; }
      .error-logo img { height: 28px; }
      .error-number-wrap { margin-bottom: 36px; }
      .btn-back {
        padding: 14px 28px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <!-- Animated aurora background -->
  <div class="aurora"></div>

  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <!-- Ambient glows -->
  <div class="glow"></div>
  <div class="glow-2"></div>

  <div class="error-wrap" id="errorWrap">

    <!-- Logo -->
    <a href="index.html" class="error-logo" aria-label="Stackly Home">
      <img src="images/logo.webp" alt="Stackly Logo">
    </a>

    <!-- Giant 404 -->
    <div class="error-number-wrap" aria-hidden="true">
      <span class="error-number">404</span>
      <span class="error-number-fill">404</span>
    </div>

    <!-- Go Back Button -->
    <button class="btn-back" onclick="history.back()" aria-label="Go back to previous page">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Go back</span>
    </button>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Trigger the gold fill animation
      const errorWrap = document.getElementById('errorWrap');
      if (errorWrap) {
        setTimeout(() => {
          errorWrap.classList.add('in-view');
        }, 500);
      }

      // Generate floating particles
      const particleLayer = document.getElementById('particles');
      if (particleLayer && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const count = 22;
        for (let i = 0; i < count; i++) {
          const p = document.createElement('span');
          p.className = 'particle';

          const size = 2 + Math.random() * 3;
          const left = Math.random() * 100;
          const duration = 9 + Math.random() * 12;
          const delay = Math.random() * 12;
          const opacity = 0.15 + Math.random() * 0.35;

          // Occasionally use teal instead of gold for variety
          const useTeal = Math.random() > 0.78;

          p.style.width = size + 'px';
          p.style.height = size + 'px';
          p.style.left = left + '%';
          p.style.bottom = '-10px';
          p.style.animationDuration = duration + 's';
          p.style.animationDelay = delay + 's';
          p.style.opacity = opacity;

          if (useTeal) {
            p.style.background = '#3a7c6c';
            p.style.boxShadow = '0 0 10px rgba(58, 124, 108, 0.7)';
          }

          particleLayer.appendChild(p);
        }
      }

      // Magnetic button effect
      const btn = document.querySelector('.btn-back');
      if (btn && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        btn.addEventListener('mousemove', (e) => {
          const rect = btn.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          btn.style.transform = `translate(${x * 0.18}px, ${y * 0.28 - 3}px) scale(1.03)`;
        });

        btn.addEventListener('mouseleave', () => {
          btn.style.transform = '';
        });
      }
    });
  </script>

</body>
</html>
